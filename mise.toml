[tools]
go         = "latest"
kprint     = "0.64.1"
tinygo     = "0.44.0"
wasm-tools = "{{ read_toml(path='internal/wasmtools/Cargo.toml')['target']['cfg(target_os = \"wasi\")']['dependencies']['wasm-tools']['version'] | trim_start(pat='=') }}"

[tool_alias]
kprint = "github:kjanat/kprint"
tinygo = "github:tinygo-org/tinygo"

[settings]
idiomatic_version_file_enable_tools = ["go"]
