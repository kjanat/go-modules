name: Renovate
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency: scheduled-renovate
jobs:
  update:
    if: github.repository == 'kjanat/go-modules'
    runs-on: ubuntu-latest
    steps:
      - uses: renovatebot/github-action@v46.3.14
        env:
          RENOVATE_REPOSITORIES: kjanat/go-modules
          RENOVATE_ONBOARDING: 'false'
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
