name: Test

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - ".vscode/**"
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  go-modules: ./... ./cm/...

jobs:
  # Vet Go code
  vet-go:
    name: Vet Go code
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: jdx/mise-action@v5
        with:
          install_args: go

      - name: Vet Go code
        run: go vet ${{ env.go-modules }} ./tests/...

  # Test with Go
  test-go:
    name: Test with Go
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: jdx/mise-action@v5
        with:
          install_args: go

      - name: Run Go tests
        run: go test -v ${{ env.go-modules }}

      - name: Run Go tests with race detector
        run: go test -v -race ${{ env.go-modules }}

      - name: Test Go without cgo
        env:
          CGO_ENABLED: 0
        run: go test -v ${{ env.go-modules }}

      - name: Test generated map bindings from a consumer module
        working-directory: tests
        env:
          GOWORK: "off"
        run: go test -v ./cm/... ./json/... ./maps/...

      - name: Verify repo is unchanged
        run: git diff --exit-code HEAD

  # Test with TinyGo
  test-tinygo:
    name: Test with TinyGo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go and TinyGo
        uses: jdx/mise-action@v5
        with:
          install_args: go tinygo

      - name: Test with TinyGo
        run: tinygo test -v ${{ env.go-modules }}

      - name: Verify repo is unchanged
        run: git diff --exit-code HEAD

  # Test with WebAssembly
  test-wasm:
    name: Test with WebAssembly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go, TinyGo and Wasmtime
        uses: jdx/mise-action@v5
        with:
          install_args: go tinygo wasmtime

      - name: Read the shipped CLI version
        id: guest
        run: |
          read -r name version rest <<< "$(go run ./internal/cmd/wasm-tools --version)"
          [[ $name == wasm-tools && $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify the embedded guest against its published asset
        if: hashFiles('internal/wasmtools/embedded-release') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.guest.outputs.version }}
        run: |
          tag=$(cat internal/wasmtools/embedded-release)
          [[ $tag == "wasm-tools/v$VERSION-kjanat."* ]]
          gh release download "$tag" -p wasm-tools.wasm.gz --dir "$RUNNER_TEMP/release"
          cmp "$RUNNER_TEMP/release/wasm-tools.wasm.gz" internal/wasmtools/wasm-tools.wasm.gz

      # TinyGo needs the matching native CLI for -target=wasip2.
      - name: Set up wasm-tools
        env:
          MISE_WASM_TOOLS_VERSION: ${{ steps.guest.outputs.version }}
        run: |
          mise install wasm-tools
          echo "MISE_WASM_TOOLS_VERSION=$MISE_WASM_TOOLS_VERSION" >> "$GITHUB_ENV"

      - name: Add Go wasm exec to $PATH
        run: echo "$(go env GOROOT)/lib/wasm" >> "${GITHUB_PATH}"

      - name: Regenerate Go
        run: make tests/generated

      - name: Verify repo is unchanged
        run: git diff --exit-code HEAD

      - name: Test wasm/wasip1 with Go
        env:
          GOARCH: wasm
          GOOS: wasip1
        run: go test -v ${{ env.go-modules }}

      - name: Test wasm/wasip1 with TinyGo
        run: tinygo test -v -target=wasip1 ${{ env.go-modules }}

      - name: Test wasm/wasip2 with TinyGo
        run: tinygo test -v -target=wasip2 ${{ env.go-modules }}

      - name: Test generated Go with TinyGo
        run: tinygo test -v -target wasip2 ./tests/...

      - name: Test generated map bindings with TinyGo from a consumer module
        working-directory: tests
        env:
          GOWORK: "off"
        run: tinygo test -v -target=wasip1 ./maps/...

      - name: Build the map fixture guest with TinyGo
        working-directory: tests
        run: tinygo build -target=wasip1 -o "$RUNNER_TEMP/maps.wasm" ./guest/maps

      - name: Compile numeric map input bindings with Go
        working-directory: tests
        env:
          GOARCH: wasm
          GOOS: wasip1
          GOWORK: "off"
        run: go build ./numeric/...

      - name: Verify repo is unchanged
        run: git diff --exit-code HEAD
