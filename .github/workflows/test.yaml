name: Test

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  GOTOOLCHAIN: local

jobs:
  vet:
    name: Vet Go code
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - &checkout
        name: Checkout repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - &mise
        name: Set up mise
        uses: kjanat/mise-action@v6

      - &cache
        name: Cache Go, TinyGo and wazero builds
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/go-build
            ~/.cache/tinygo
            ~/AppData/Local/go-build
            ~/AppData/Local/tinygo
            ~/go/pkg/mod
            ~/AppData/Local/Temp/github.com/kjanat/go-modules@*
            /tmp/github.com/kjanat/go-modules@*
          key: build-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-${{ hashFiles('**/go.sum', 'mise.toml', 'internal/wasmtools/wasm-tools.wasm.gz') }}
          restore-keys: build-${{ runner.os }}-${{ github.job }}-${{ strategy.job-index }}-

      - name: Vet Go code
        run: mise run vet

  test:
    name: ${{ matrix.task }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
        task:
          - test:go
          - test:go:race
          - test:go:wasip1
          - test:tinygo
          - test:tinygo:wasip1
          - test:tinygo:wasip2
          - test:bindings:standalone
          - test:bindings:regenerated
          - wasm-tools:verify-release
        include:
          - os: ubuntu-latest
            task: test:maps:go
        exclude:
          # Go runs wasip1 tests through go_wasip1_wasm_exec, a bash script that mounts the host root into the guest.
          - os: windows-latest
            task: test:go:wasip1
          # TinyGo passes Windows host paths as the guest's PWD and preopens, which WASI resolves as relative names.
          - os: windows-latest
            task: test:tinygo:wasip1
          - os: windows-latest
            task: test:tinygo:wasip2
    steps:
      - *checkout

      - *mise

      - *cache

      - name: Run ${{ matrix.task }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ matrix.task }}
        run: mise run $env:TASK

      - name: Verify repo is unchanged
        run: git diff --exit-code HEAD
