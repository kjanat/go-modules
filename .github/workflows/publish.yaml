name: Publish packages
on:
  workflow_dispatch:
    inputs:
      beepboop_execution_id:
        description: Beepboop execution
        required: true
        type: string
      beepboop_title:
        description: Beepboop run title
        required: false
        type: string
jobs:
  begin:
    name: Begin release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    outputs:
      sourceSha: ${{ fromJSON(steps.beepboop.outputs.context).sourceSha }}
      version: ${{ fromJSON(steps.beepboop.outputs.context).version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: promote
  build-wit-bindgen-go:
    name: Build wit-bindgen-go (${{ matrix.goos }}/${{ matrix.goarch }})
    needs:
      - begin
    runs-on: ubuntu-26.04
    timeout-minutes: 240
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            asset: wit-bindgen-go-linux-amd64
          - goos: linux
            goarch: arm64
            asset: wit-bindgen-go-linux-arm64
          - goos: darwin
            goarch: amd64
            asset: wit-bindgen-go-darwin-amd64
          - goos: darwin
            goarch: arm64
            asset: wit-bindgen-go-darwin-arm64
          - goos: windows
            goarch: amd64
            asset: wit-bindgen-go-windows-amd64.exe
          - goos: windows
            goarch: arm64
            asset: wit-bindgen-go-windows-arm64.exe
          - goos: freebsd
            goarch: amd64
            asset: wit-bindgen-go-freebsd-amd64
          - goos: freebsd
            goarch: "386"
            asset: wit-bindgen-go-freebsd-386
          - goos: freebsd
            goarch: arm64
            asset: wit-bindgen-go-freebsd-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.begin.outputs.sourceSha }}
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ./go.mod
          cache-dependency-path: ./go.sum
      - id: asset
        name: Name the release asset
        shell: bash
        env:
          VERSION: ${{ needs.begin.outputs.version }}
          TEMPLATE: ${{ matrix.asset }}
        run: |
          mkdir -p dist
          echo "name=${TEMPLATE//\{version\}/${VERSION}}" >> "${GITHUB_OUTPUT}"
      - name: Build wit-bindgen-go
        shell: bash
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          MODULE: .
          PACKAGE: ./cmd/wit-bindgen-go
          VERSION: ${{ needs.begin.outputs.version }}
          ASSET: ${{ steps.asset.outputs.name }}
        run: |
          go build -C "${MODULE}" -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o "${GITHUB_WORKSPACE}/dist/${ASSET}" "${PACKAGE}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.asset.outputs.name }}
          path: dist/${{ steps.asset.outputs.name }}
          if-no-files-found: error
  publish:
    permissions:
      contents: write
      id-token: write
      attestations: write
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: kjanat/beepboop/actions/begin@v1
        id: beepboop
        with:
          execution-id: ${{ inputs.beepboop_execution_id }}
          stream: main
          operation: promote
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.beepboop.outputs.context).sourceSha }}
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      - id: beepboop_publish
        name: Publish selected packages
        uses: kjanat/beepboop/actions/publish@v1
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        shell: bash
        working-directory: dist
        run: |
          sha256sum -- * > checksums.txt
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        env:
          SYFT_SOURCE_NAME: ${{ github.event.repository.name }}
          SYFT_SOURCE_VERSION: ${{ fromJSON(steps.beepboop.outputs.context).version }}
          SYFT_FILE_METADATA_SELECTION: all
          SYFT_SELECT_CATALOGERS: -pe-package
        with:
          path: dist
          format: spdx-json
          output-file: dist/${{ github.event.repository.name }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
          sbom-path: dist/${{ github.event.repository.name }}.spdx.json
      - id: beepboop_binaries
        name: Upload binaries to the draft release
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ fromJSON(steps.beepboop.outputs.context).draftRelease.tag }}
        run: |
          gh release upload "${TAG}" --clobber -- *
      - id: beepboop_token
        uses: kjanat/beepboop/actions/token@v1
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
          permission-contents: write
      - id: beepboop_refs
        uses: kjanat/beepboop/actions/publish-refs@v1
        env:
          ${{ insert }}: ${{ fromJSON(steps.beepboop_token.outputs.gitId || '{}') }}
        with:
          token: ${{ steps.beepboop_token.outputs.token }}
      - uses: kjanat/beepboop/actions/publish-release@v1
        with:
          execution-id: ${{ steps.beepboop.outputs.execution-id }}
    needs:
      - build-wit-bindgen-go
    timeout-minutes: 30
run-name: ${{ inputs.beepboop_title || github.workflow }}
