name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to rebuild and attest
        required: true
        type: string

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest

    strategy:
      matrix:
        GOOS: [linux, windows, darwin]
        GOARCH: [amd64, arm64]
        exclude: [{ GOOS: windows, GOARCH: arm64 }]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Set up Go
        uses: kjanat/mise-action@v6

      - name: Run Go tests
        run: go test ./... ./cm/...

      - name: Build binary
        env: { "${{ insert }}": "${{ matrix }}" }
        run: |
          mkdir -p build
          go build -o wit-bindgen-go ./cmd/wit-bindgen-go
          tar -czf "build/wit-bindgen-go-${GOOS}-${GOARCH}.tgz" wit-bindgen-go

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wit-bindgen-go_${{ matrix.GOOS }}_${{ matrix.GOARCH }}
          path: build/wit-bindgen-go-${{ matrix.GOOS }}-${{ matrix.GOARCH }}.tgz
          retention-days: 1

  release:
    name: Create GitHub release
    permissions:
      contents: read
      id-token: write
      attestations: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: build/
          merge-multiple: true # all artifacts are downloaded to this directory

      - name: Attest binaries
        uses: actions/attest@v4
        with:
          subject-path: build/*.tgz

      - name: Extract release notes
        run: ./scripts/extract-changelog.sh "${TAG}" > RELEASE_NOTES.md

      - name: Get Beepboop publication token
        id: beepboop
        uses: kjanat/beepboop/actions/token@v1
        with: { permission-contents: write }
      - name: Create release
        env: { GH_TOKEN: "${{ steps.beepboop.outputs.token }}" }
        run: |
          if gh release view "${TAG}" --json tagName --jq .tagName; then exit 0; fi
          flags=()
          if [[ "${TAG%%+*}" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "${TAG}" --verify-tag --title "${TAG}" \
            --notes-file RELEASE_NOTES.md "${flags[@]}" ./build/*.tgz
