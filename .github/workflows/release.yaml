name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.*"

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest

    strategy:
      matrix:
        GOOS: [linux, windows, darwin]
        GOARCH: [amd64, arm64]
        exclude: [{ GOOS: windows, GOARCH: arm64 }]

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Go
        uses: kjanat/mise-action@v6

      - name: Run Go tests
        run: go test ./... ./cm/...

      - name: Build binary
        env: { "${{ insert }}": "${{ fromjson(matrix) }}" }
        run: |
          mkdir -p build
          go build -o wit-bindgen-go ./cmd/wit-bindgen-go
          tar -czf "build/wit-bindgen-go-${GOOS}-${GOARCH}.tgz" wit-bindgen-go

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: wit-bindgen-go_${{ matrix.GOOS }}_${{ matrix.GOARCH }}
          path: build/wit-bindgen-go-${{ matrix.GOOS }}-${{ matrix.GOARCH }}.tgz
          retention-days: 1

  release:
    name: Create GitHub release
    permissions:
      contents: read
      id-token: write
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with: { persist-credentials: false }

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: build/
          merge-multiple: true # all artifacts are downloaded to this directory

      - name: Extract release notes
        run: ./scripts/extract-changelog.sh "${GITHUB_REF_NAME}" > RELEASE_NOTES.md

      - name: Get Beepboop publication token
        id: beepboop
        uses: kjanat/beepboop/actions/token@v1
        with: { permission-contents: write }
      - name: Create release
        env: { GH_TOKEN: "${{ steps.beepboop.outputs.token }}" }
        run: |
          flags=()
          if [[ "${GITHUB_REF_NAME%%+*}" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "${GITHUB_REF_NAME}" --verify-tag --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md "${flags[@]}" ./build/*.tgz
