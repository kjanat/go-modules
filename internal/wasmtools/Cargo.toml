[package]
name    = "embedded-wasm-tools"
version = "0.0.0"
edition = "2024"
publish = false

[build-dependencies]
serde_json = "1"

[target.'cfg(target_os = "wasi")'.dependencies]
wasm-tools = { version = "=1.263.0", default-features = false, features = ["component"] }

[profile.release]
opt-level     = "z"
strip         = true
lto           = true
panic         = "abort"
codegen-units = 1
